<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <script>
      (function () {
        var standalone = window.navigator.standalone || window.matchMedia("(display-mode: standalone)").matches;
        var h = standalone ? Math.max(window.innerHeight, screen.height || 0) : window.innerHeight;
        var root = document.documentElement;
        root.style.setProperty("--app-h", h + "px");
        root.style.setProperty("--app-top", "0px");
      })();
    </script>
    <meta name="theme-color" content="#2D2D2D" />
    <meta name="description" content="OzerilBusiness — приложение для исполнителей" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ozeril Biz" />
    <title>OzerilBusiness</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
